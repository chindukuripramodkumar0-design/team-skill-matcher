<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Skill Matcher — AI-Assisted Platform</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vercel: {
              black: '#000000',
              panel: '#111111',
              card: '#161616',
              border: '#333333',
              muted: '#888888',
              accent: '#0070f3',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            glow: '0 0 20px rgba(0, 112, 243, 0.15)',
            'glow-sm': '0 0 10px rgba(0, 112, 243, 0.1)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-slate-900 antialiased">
  <div id="root"></div>
  <script type="text/babel" data-presets="react" src="./js/app.js"></script>
</body>
</html>
